ound:white;border:1px solid #e7ebf1;border-radius:13px;box-shadow:0 3px 12px #14253c08}.metric{padding:15px}.metric small{font-size:10px;color:#8b96a6;font-weight:700}.metric strong{display:block;font-size:25px;color:#1d3554;margin:8px 0 3px}.panel{overflow:hidden;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #edf0f4;gap:10px}.head h3{margin:0;font-size:13px}.head p{margin:4px 0 0;color:#99a3b2;font-size:10px}.toolbar{display:flex;gap:8px;padding:12px 17px;flex-wrap:wrap}.search{flex:1;min-width:180px}.search input,.field input,.field select,.field textarea,.toolbar select{width:100%;border:1px solid #e1e6ed;background:#fbfcfe;border-radius:8px;padding:10px;font-size:11px;outline:none}.toolbar select{width:auto;min-width:125px}table{border-collapse:collapse;width:100%;min-width:720px}th{text-align:left;background:#fafbfd;color:#8d98a8;font-size:9px;text-transform:uppercase;padding:11px 13px}td{border-top:1px solid #eef1f5;padding:11px 13px;font-size:11px;color:#536176}.tablewrap{overflow:auto}.product{display:flex;align-items:center;gap:9px;min-width:220px}.thumb{width:38px;height:38px;object-fit:contain;border-radius:8px;background:#f6f8fa;border:1px solid #edf0f4}.pname{font-weight:750;color:#26364d;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sku{font-size:9px;color:#9aa4b2;margin-top:3px}.status{display:inline-block;padding:5px 8px;border-radius:20px;background:#fff4df;color:#9a681d;font-size:9px;font-weight:750}.found{background:#e8f6ee;color:#27764e}.review{background:#f3edff;color:#7751a5}.discard{background:#fae9e8;color:#b42318}.money{font-weight:750;color:#263b58;white-space:nowrap}.actions{display:flex;gap:4px}.iconbtn{border:1px solid #e4e9ef;background:white;border-radius:7px;padding:6px 8px;color:#627087;font-size:10px;cursor:pointer}.empty{padding:32px;text-align:center;color:#9aa4b2;font-size:11px}.footrow{padding:10px 17px;border-top:1px solid #edf0f4;display:flex;justify-content:space-between;color:#98a2b1;font-size:9px}.module{padding:18px}.module h3{font-size:13px;margin:0 0 7px}.module p{font-size:11px;color:#7d899a;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:10px;font-weight:700;color:#65738a}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.modalback{position:fixed;inset:0;background:#101b2db3;z-index:20;display:grid;place-items:center;padding:14px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:15px}.modalhead,.modalfoot{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf0f4}.modalhead h3{font-size:14px;margin:0}.modalbody{padding:18px}.modalfoot{border-top:1px solid #edf0f4;border-bottom:0;justify-content:flex-end;gap:8px}.close{border:0;background:#f0f2f5;border-radius:7px;padding:6px 9px}.result{padding:11px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:10px;font-size:11px}.result small{display:block;color:#98a2b1;margin-top:4px}.notice{background:#f1f5f9;border-radius:9px;padding:11px 13px;font-size:10px;line-height:1.55;color:#65738a;margin:10px 0}.notice.warn{background:#fff4e2;color:#95651d}.notice.ok{background:#e9f7ef;color:#27764e}.link{color:#315b89}.toast{position:fixed;right:15px;bottom:15px;background:#1b2e47;color:white;padding:12px 15px;border-radius:9px;font-size:11px;z-index:50}@media(max-width:950px){.app{grid-template-columns:200px 1fr}.main{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.app{display:block}.side{position:sticky;top:0;height:auto;z-index:10;padding:10px;gap:10px}.brand{padding:0 4px}.mark{width:30px;height:30px}.brand b{font-size:13px}.brand small,.navlabel,.foot{display:none}.nav{display:flex;overflow:auto;gap:3px}.nav button{white-space:nowrap;padding:8px;font-size:10px}.main{padding:15px 11px}.top h1{font-size:20px}.metrics{gap:7px}.metric{padding:11px}.metric strong{font-size:21px}.grid,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar .search{min-width:100%}.toolbar select{flex:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">MP</div><div><b>MARKETPREÇO</b><small>Gestão de produtos e vendas</small></div></div><div><div class="navlabel">WORKSPACE</div><nav class="nav"><button class="active" data-view="dashboard">▦ Visão geral</button><button data-view="products">▤ Produtos</button><button data-view="research">⌕ Pesquisas</button><button data-view="pricing">◈ Precificação</button><button data-view="videos">▣ Vídeos</button><button data-view="inventory">▥ Estoque</button><button data-view="reports">▧ Relatórios</button><button data-view="settings">⚙ Configurações</button></nav></div><div class="foot">● Cloudflare D1 conectado<br>Persistência na nuvem<br>MARKETPREÇO · 2026</div></aside><main class="main"><header class="top"><div><div class="crumb">MARKETPREÇO / <span id="crumb">Painel</span></div><h1 id="title">Visão geral</h1></div><button class="btn gold" id="quickAdd">＋ Novo produto</button></header><div id="view"><div class="empty">Carregando...</div></div></main></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));const st={products:[],research:[],videos:[],settings:{margin:20,mlClassic:13,tiktokLowPercent:10,tiktokLowFixed:4,tiktokHighPercent:6,tiktokHighFixed:6,pifPercent:6,pifCap:50},view:"dashboard",query:"",status:""};const names={dashboard:["Visão geral","Painel"],products:["Produtos","Catálogo"],research:["Pesquisas","Pesquisa de mercado"],pricing:["Precificação","Regras comerciais"],videos:["Vídeos","Biblioteca de mídia"],inventory:["Estoque","Controle interno"],reports:["Relatórios","Exportações"],settings:["Configurações","Sistema"]};const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();async function api(path,opt={}){const h={...(opt.headers||{})};if(!(opt.body instanceof FormData))h["content-type"]="application/json";const r=await fetch("https://marketpreco-app.leoduarte13.workers.dev"+path,{...opt,headers:h});const d=await r.json().catch(()=>({error:"Resposta inválida"}));if(!r.ok)throw Error(d.error||"Erro HTTP "+r.status);return d}function toast(s){const n=document.createElement("div");n.className="toast";n.textContent=s;$("#toastRoot").append(n);setTimeout(()=>n.remove(),3200)}function status(s){const c=s==="Encontrado"?"found":s==="Revisar"?"review":s==="Descartado"?"discard":"";return '<span class="status '+c+'">'+esc(s||"Pendente")+"</span>"}function img(p){const u=p.image_url||p.image||"";if(!u)return "";return u.startsWith("/api/image")?"https://marketpreco-app.leoduarte13.workers.dev"+u:"https://marketpreco-app.leoduarte13.workers.dev/api/image?url="+encodeURIComponent(u)}async function refresh(){const [p,r,v,s]=await Promise.all([api("/api/products"),api("/api/research"),api("/api/videos"),api("/api/settings")]);st.products=p.products||[];st.research=r.records||[];st.videos=v.videos||[];st.settings={...st.settings,...s.settings};render()}function go(v){st.view=v;$$("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===v));$("#title").textContent=names[v][0];$("#crumb").textContent=names[v][1];render()}function productRows(list){if(!list.length)return '<tr><td colspan="7" class="empty">Nenhum produto encontrado.</td></tr>';return list.map(p=>'<tr><td><div class="product"><img class="thumb" src="'+esc(img(p))+'" onerror="this.style.visibility=\'hidden\'"><div><div class="pname">'+esc(p.name)+'</div><div class="sku">SKU '+esc(p.sku||"—")+' · ID '+esc(p.id)+'</div></div></div></td><td class="money">'+money(p.cost)+'</td><td>'+status(p.status)+'</td><td>'+(p.available===false?"Indisponível":"Disponível")+'</td><td>'+st.research.filter(r=>String(r.product_id)===String(p.id)).length+'</td><td>'+esc((p.updated_at||"").slice(0,10)||"—")+'</td><td><div class="actions"><button class="iconbtn" data-edit="'+esc(p.id)+'">Editar</button><button class="iconbtn" data-res="'+esc(p.id)+'">Pesquisa</button><button class="iconbtn" data-del="'+esc(p.id)+'">×</button></div></td></tr>').join("")}function filtered(){const q=st.query.toLowerCase();return st.products.filter(p=>(!st.status||p.status===st.status)&&(!q||[p.name,p.sku,p.id].some(v=>String(v||"").toLowerCase().includes(q))))}function table(){return '<section class="panel"><div class="head"><div><h3>Catálogo de produtos</h3><p>Produtos, custos, status e histórico</p></div><button class="btn small" id="add">＋ Cadastrar</button></div><div class="toolbar"><div class="search"><input id="q" value="'+esc(st.query)+'" placeholder="Buscar nome, SKU ou código"></div><select id="statusFilter"><option value="">Todos os status</option>'+["Pendente","Encontrado","Revisar","Descartado"].map(s=>'<option '+(st.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="btn light small" id="import">Importar Excel/CSV</button><button class="btn light small" id="export">Exportar CSV</button></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Custo</th><th>Status</th><th>Disponibilidade</th><th>Pesquisas</th><th>Atualizado</th><th>Ações</th></tr></thead><tbody>'+productRows(filtered())+'</tbody></table></div><div class="footrow"><span>'+filtered().length+' de '+st.products.length+' produtos</span><span>Cloudflare D1</span></div></section>'}function dashboard(){const p=st.products;return '<section class="welcome"><h2>Seu catálogo, organizado para vender melhor.</h2><p>Gerencie produtos, pesquisas, preços e vídeos em um único ambiente.</p></section><section class="metrics"><article class="metric"><small>Produtos cadastrados</small><strong>'+p.length+'</strong></article><article class="metric"><small>Encontrados</small><strong>'+p.filter(x=>x.status==="Encontrado").length+'</strong></article><article class="metric"><small>Pendentes</small><strong>'+p.filter(x=>!x.status||x.status==="Pendente").length+'</strong></article><article class="metric"><small>Revisar</small><strong>'+p.filter(x=>x.status==="Revisar").length+'</strong></article></section><section class="grid"><article class="module"><h3>Atalhos</h3><p>Acesse as ferramentas principais.</p><button class="btn" data-go="products">Catálogo</button> <button class="btn light" data-go="research">Pesquisas</button> <button class="btn light" data-go="pricing">Precificação</button></article><article class="module"><h3>Dados na nuvem</h3><p>'+st.research.length+' pesquisas registradas · '+st.videos.length+' vídeos vinculados.</p><p>Banco de dados Cloudflare D1 ativo.</p></article></section><div style="height:14px"></div>'+table()}function modal(title,body,save){$("#modalRoot").innerHTML='<div class="modalback" id="back"><section class="modal"><header class="modalhead"><h3>'+esc(title)+'</h3><button class="close" id="close">×</button></header><div class="modalbody">'+body+'</div><footer class="modalfoot"><button class="btn light" id="cancel">Cancelar</button><button class="btn gold" id="save">Salvar</button></footer></section></div>';const close=()=>$("#modalRoot").innerHTML="";$("#close").onclick=$("#cancel").onclick=close;$("#back").onclick=e=>{if(e.target.id==="back")close()};$("#save").onclick=async()=>{try{await save();close()}catch(e){toast(e.message)}}}function editProduct(p={}){const edit=!!p.id;modal(edit?"Editar produto":"Cadastrar produto",'<div class="formgrid"><div class="field full"><label>Nome *</label><input id="name" value="'+esc(p.name||"")+'"></div><div class="field"><label>SKU</label><input id="sku" value="'+esc(p.sku||"")+'"></div><div class="field"><label>Custo (R$) *</label><input id="cost" type="number" min="0" step=".01" value="'+esc(p.cost??"")+'"></div><div class="field"><label>Status</label><select id="stat">'+["Pendente","Encontrado","Revisar","Descartado"].map(s=>'<option '+((p.status||"Pendente")===s?"selected":"")+'>'+s+'</option>').join("")+'</select></div><div class="field"><label>Disponibilidade</label><select id="available"><option value="true" '+(p.available!==false?"selected":"")+'>Disponível</option><option value="false" '+(p.available===false?"selected":"")+'>Indisponível</option></select></div><div class="field full"><label>URL da imagem</label><input id="image" value="'+esc(p.image_url||p.image||"")+'"></div><div class="field full"><label>Observações</label><textarea id="notes">'+esc(p.notes||"")+'</textarea></div></div>',async()=>{const name=$("#name").value.trim(),cost=Number($("#cost").value);if(!name||!Number.isFinite(cost)||cost<0)throw Error("Informe nome e custo válido.");const x={...p,id:p.id||uid(),name,sku:$("#sku").value.trim(),cost,status:$("#stat").value,available:$("#available").value==="true",image:$("#image").value.trim(),image_url:$("#image").value.trim(),notes:$("#notes").value.trim()};await api("/api/products"+(edit?"/"+encodeURIComponent(p.id):""),{method:edit?"PUT":"POST",body:JSON.stringify(x)});await refresh();toast("Produto salvo no Cloudflare.")})}function researchForm(p){const list=st.research.filter(r=>String(r.product_id)===String(p.id));modal("Pesquisa: "+p.name,'<div id="existing">'+(list.map(r=>'<div class="result"><div><b>'+esc(r.found_name||r.title||"Resultado")+'</b><small>'+esc(r.platform||"")+' · '+esc(r.store||"")+'</small>'+(r.url?'<a class="link" target="_blank" href="'+esc(r.url)+'">Abrir anúncio</a>':"")+'</div><b>'+money(r.price)+'</b></div>').join("")||'<div class="empty">Nenhuma pesquisa registrada.</div>')+'</div><div class="formgrid"><div class="field"><label>Plataforma</label><select id="platform"><option>Mercado Livre</option><option>Shopee</option><option>TikTok Shop</option><option>SHEIN</option><option>Outro</option></select></div><div class="field"><label>Preço encontrado</label><input id="rprice" type="number" step=".01"></div><div class="field full"><label>Nome do anúncio</label><input id="rname" value="'+esc(p.name)+'"></div><div class="field full"><label>Loja</label><input id="store"></div><div class="field full"><label>Link</label><input id="url" placeholder="https://..."></div><div class="field full"><label>Observações</label><textarea id="note"></textarea></div></div>',async()=>{const r={id:uid(),product_id:String(p.id),product_name:p.name,found_name:$("#rname").value,platform:$("#platform").value,price:$("#rprice").value?Number($("#rprice").value):null,store:$("#store").value,url:$("#url").value,note:$("#note").value,researched_at:new Date().toISOString()};await api("/api/research",{method:"POST",body:JSON.stringify(r)});await refresh();toast("Pesquisa registrada.")});$("#save").textContent="Salvar pesquisa";const scan=document.createElement("button");scan.className="btn light";scan.textContent="Analisar link";$("#save").before(scan);scan.onclick=async()=>{const url=$("#url").value.trim();if(!url){toast("Informe o link do anúncio.");return}scan.disabled=true;try{const d=await api("/api/scan",{method:"POST",body:JSON.stringify({url,productName:p.name})});if(d.candidates&&d.candidates.length){$("#url").value=d.candidates[0].url;$("#note").value=(d.note||"")+((d.note?"\n":"")+"Mídia detectada: "+d.candidates.length);toast("Análise concluída. Confira o link antes de salvar.")}else toast(d.message||"Nenhuma mídia direta detectada.")}catch(e){toast(e.message)}finally{scan.disabled=false}}}function researchRows(list){return list.map(r=>'<tr><td>'+esc(r.product_name||r.found_name)+'</td><td>'+esc(r.platform)+'</td><td>'+(r.url?'<a class="link" target="_blank" href="'+esc(r.url)+'">'+esc(r.found_name||"Abrir")+'</a>':esc(r.found_name))+'</td><td>'+money(r.price)+'</td><td>'+esc((r.researched_at||"").slice(0,10))+'</td><td><button class="iconbtn" data-delr="'+esc(r.id)+'">Excluir</button></td></tr>').join("")||'<tr><td colspan="6" class="empty">Sem pesquisas cadastradas.</td></tr>'}function researchPage(){return '<section class="panel"><div class="head"><div><h3>Histórico de pesquisas</h3><p>Resultados vinculados aos produtos</p></div></div><div class="toolbar"><div class="search"><input id="rq" placeholder="Filtrar produto, plataforma ou loja"></div></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Plataforma</th><th>Anúncio</th><th>Preço</th><th>Data</th><th></th></tr></thead><tbody id="researchRows">'+researchRows(st.research)+'</tbody></table></div></section><div class="notice">Abra Produtos e use a ação Pesquisa para registrar um resultado vinculado ao item.</div>'}function calc(cost,platform){const m=(Number(st.settings.margin)||20)/100;let rate=0,fixed=0,price=0;if(platform==="Mercado Livre Clássico"){rate=(Number(st.settings.mlClassic)||13)/100;price=cost/(1-rate-m)}else if(platform==="TikTok Shop"){const low=(cost+(Number(st.settings.tiktokLowFixed)||4))/(1-(Number(st.settings.tiktokLowPercent)||10)/100-m);if(low<50){rate=(Number(st.settings.tiktokLowPercent)||10)/100;fixed=Number(st.settings.tiktokLowFixed)||4;price=low}else{rate=(Number(st.settings.tiktokHighPercent)||6)/100;fixed=Number(st.settings.tiktokHighFixed)||6;price=(cost+fixed)/(1-rate-m)}}else if(platform==="PIF/SFP"){rate=(Number(st.settings.pifPercent)||6)/100;price=cost/(1-rate-m)}else price=cost/(1-m);const fee=Math.min(price*rate,platform==="PIF/SFP"?(Number(st.settings.pifCap)||50):Infinity)+fixed;return {price,fee,profit:price-cost-fee,margin:price?(price-cost-fee)/price*100:0}}function priceRow(p,platform){const c=calc(Number(p.cost)||0,platform);return '<tr><td>'+esc(p.name)+'</td><td>'+money(p.cost)+'</td><td class="money">'+money(c.price)+'</td><td>'+money(c.fee)+'</td><td class="money">'+money(c.profit)+'</td><td>'+c.margin.toFixed(1).replace(".",",")+"%</td></tr>"}function pricing(){return '<section class="panel"><div class="head"><div><h3>Simulador de preços</h3><p>Margem mínima e taxas por plataforma</p></div><button class="btn light small" id="priceExport">Exportar</button></div><div class="toolbar"><div class="field" style="margin:0;min-width:140px"><label>Margem mínima (%)</label><input id="margin" type="number" value="'+esc(st.settings.margin)+'"></div><div class="field" style="margin:0;min-width:185px"><label>Plataforma</label><select id="pricePlatform"><option>Mercado Livre Clássico</option><option>TikTok Shop</option><option>PIF/SFP</option><option>Venda direta</option></select></div></div><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Custo</th><th>Preço sugerido</th><th>Taxa</th><th>Lucro líquido</th><th>Margem</th></tr></thead><tbody id="priceRows">'+st.products.map(p=>priceRow(p,"Mercado Livre Clássico")).join("")+'</tbody></table></div></section><div class="notice">Mercado Livre Clássico 13%; TikTok abaixo de R$ 50: 10% + R$ 4; a partir de R$ 50: 6% + R$ 6; PIF/SFP: 6%, limitado a R$ 50. Frete não incluído. Confirme tarifas vigentes antes de publicar.</div>'}function videoRows(list){return list.map(v=>'<div class="result" style="padding:13px 18px"><div><b>'+esc(v.product_name||v.title||"Vídeo")+'</b><small>'+esc(v.platform||"")+' · '+esc(v.video_url||"")+'</small>'+(v
